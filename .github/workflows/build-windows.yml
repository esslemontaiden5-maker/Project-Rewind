name: Build Windows Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone launcher
        run: dotnet publish src/RewindLauncher/RewindLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release
      - name: Create download archive
        shell: pwsh
        run: Compress-Archive -Path release/RewindLauncher.exe -DestinationPath RewindLauncher-Windows-x64.zip
      - name: Upload Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: RewindLauncher-Windows-x64
          path: RewindLauncher-Windows-x64.zip
          if-no-files-found: error
